<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Timebox PDF Planner Generator</title>
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://eugeny-dementev.github.io/timebox/generate" />
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script
      type="module"
      src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs"
    ></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
  </head>
  <body class="bg-gray-800 text-white">
    <div class="m-8">
      <header class="flex items-center justify-center mb-6">
        <div class="relative z-10">
          <h1 class="text-6xl font-bold text-white">Timebox Planner PDFs</h1>
        </div>
      </header>
      <div class="flex flex-col items-center justify-center gap-2 mb-6">
        <label for="pageLayout">Paper layout</label>
        <select
          id="pageLayout"
          class="bg-gray-700 text-white border border-gray-600 rounded px-4 py-2"
          onchange="selectPageLayout(this)"
        >
          <option value="a5-single">A5 · 1 planner</option>
          <option value="a4-double">A4 · 2 planners</option>
        </select>
        <p id="printHint" class="hidden text-sm text-gray-300 text-center">
          Two rotated A5 planners. Print portrait at 100% / Actual size.
        </p>
      </div>
      <div class="flex flex-col items-center justify-center mb-6">
        <div class="inline-flex flex-wrap" id="buttonGroup">
          <button
            class="text-xl md:text-base bg-gray-600 hover:bg-gray-500 px-6 md:px-4 py-3 md:py-2 border border-gray-600 rounded-l focus:outline-none"
            onclick="selectButton(this)"
          >
            day
          </button>
          <button
            class="text-xl md:text-base bg-gray-700 hover:bg-gray-600 px-6 md:px-4 py-3 md:py-2 border-t border-b border-gray-700 focus:outline-none"
            onclick="selectButton(this)"
          >
            week
          </button>
          <button
            class="text-xl md:text-base bg-gray-700 hover:bg-gray-600 px-6 md:px-4 py-3 md:py-2 border border-gray-700 rounded-r focus:outline-none"
            onclick="selectButton(this)"
          >
            month
          </button>
        </div>
      </div>
      <div
        id="dayily-version-options"
        class="flex flex-col items-center justify-center mb-6 invisible"
      >
        <div class="inline-flex flex-wrap" id="versionButtonGroup">
          <button
            class="text-xl md:text-base bg-gray-600 hover:bg-gray-500 px-6 md:px-4 py-3 md:py-2 border border-gray-600 rounded-l focus:outline-none"
            onclick="selectDailyVersion(this)"
          >
            v1
          </button>
          <button
            class="text-xl md:text-base bg-gray-700 hover:bg-gray-600 px-6 md:px-4 py-3 md:py-2 border border-gray-700 rounded-r focus:outline-none"
            onclick="selectDailyVersion(this)"
          >
            v2
          </button>
          <button
            class="text-xl md:text-base bg-gray-700 hover:bg-gray-600 px-6 md:px-4 py-3 md:py-2 border border-gray-700 rounded-r focus:outline-none"
            onclick="selectDailyVersion(this)"
          >
            v3
          </button>
        </div>
      </div>
      <div
        id="month-split-options"
        class="flex flex-col items-center justify-center mb-6 invisible"
      >
        <div class="inline-flex flex-wrap" id="splitButtonGroup">
          <button
            class="text-xl md:text-base bg-gray-600 hover:bg-gray-500 px-6 md:px-4 py-3 md:py-2 border border-gray-600 rounded-l focus:outline-none"
            onclick="selectMonthlySplit(this)"
          >
            day
          </button>
          <button
            class="text-xl md:text-base bg-gray-700 hover:bg-gray-600 px-6 md:px-4 py-3 md:py-2 border border-gray-700 rounded-r focus:outline-none"
            onclick="selectMonthlySplit(this)"
          >
            week
          </button>
        </div>
      </div>
      <div class="flex flex-col items-center justify-center mb-6">
        <div class="inline-flex flex-wrap">
          <button
            class="text-xl md:text-base bg-gray-600 hover:bg-gray-500 px-6 md:px-4 py-3 md:py-2 border border-gray-600 rounded-l focus:outline-none"
            onclick="downloadPdf()"
            id="downloadButton"
            disabled
          >
            download
          </button>
        </div>
      </div>
    </div>

    <p id="pdfError" role="alert" class="hidden text-center text-red-300 mx-4 mb-4"></p>
    <div id="pdfViewer" class="flex justify-center items-center px-4 pb-6" aria-busy="true"></div>

    <script type="module">
      import { getDailyDoc } from "./daily.mjs";
      import { getWeeklyDoc } from "./weekly.mjs";
      import { getMonthlyDoc } from "./monthly.mjs";

      const getDoc = {
        day: getDailyDoc,
        week: getWeeklyDoc,
        month: getMonthlyDoc,
      };

      let selectedTimeboxRange = "day";
      let selectedMonthlySplit = "week";
      let selectedDayilyVersion = "v1";
      let selectedPageLayout = "a5-single";

      let doc = null;
      let docName = null;
      let previewRevision = 0;

      let cellSize = 9.5;
      let startingHour = 8;

      function highlightButton(selectedButton, groupId) {
        // Remove the bg-gray-600 class and adjust border color for all buttons
        let buttons = document.getElementById(groupId).children;
        for (let button of buttons) {
          button.classList.remove("bg-gray-600");
          button.classList.add("bg-gray-700");
          button.style.borderColor = "#4B5563"; // Border color of unselected buttons
        }

        // Add the bg-gray-600 class to the clicked button and adjust border color
        selectedButton.classList.remove("bg-gray-700");
        selectedButton.classList.add("bg-gray-600");
        selectedButton.style.borderColor = "#1F2937"; // Border color of the selected button
      }

      function selectButton(selectedButton) {
        highlightButton(selectedButton, "buttonGroup");
        selectedTimeboxRange = selectedButton.textContent.trim();

        if (selectedTimeboxRange == "month") {
          let splitOptions = document.getElementById("month-split-options");
          splitOptions.classList.remove("invisible");
        } else {
          let splitOptions = document.getElementById("month-split-options");
          splitOptions.classList.add("invisible");
        }

        if (selectedTimeboxRange == "day") {
          let splitOptions = document.getElementById("dayily-version-options");
          splitOptions.classList.remove("invisible");
        } else {
          let splitOptions = document.getElementById("dayily-version-options");
          splitOptions.classList.add("invisible");
        }

        renderPDFDoc();
      }

      window.selectButton = selectButton;

      function downloadPdf() {
        if (!doc) return;
        doc.save(docName);

        // Reuse the parent tracker to keep one visitor session and page view.
        // Analytics is optional: a blocked tracker must not affect downloads.
        try {
          const eventData = {
            range: selectedTimeboxRange,
            layout: selectedPageLayout,
            filename: docName,
          };
          if (selectedTimeboxRange === "day") {
            eventData.version = selectedDayilyVersion;
          } else if (selectedTimeboxRange === "month") {
            eventData.split = selectedMonthlySplit;
          }
          const parent = window.parent;
          parent.umami?.track(properties => ({
            ...properties,
            url: parent.location.href,
            title: parent.document.title,
            name: "pdf_download",
            data: eventData,
          }))?.catch(() => {});
        } catch {
          // Ignore unavailable analytics, including cross-origin embedding.
        }
      }

      window.downloadPdf = downloadPdf;

      function selectDailyVersion(selectedButton) {
        highlightButton(selectedButton, "versionButtonGroup");
        selectedDayilyVersion = selectedButton.textContent.trim();
        renderPDFDoc();
      }

      window.selectDailyVersion = selectDailyVersion;

      function selectMonthlySplit(selectedButton) {
        highlightButton(selectedButton, "splitButtonGroup");
        selectedMonthlySplit = selectedButton.textContent.trim();
        renderPDFDoc();
      }

      window.selectMonthlySplit = selectMonthlySplit;

      function selectPageLayout(select) {
        selectedPageLayout = select.value;
        document.getElementById("printHint").classList.toggle("hidden", selectedPageLayout !== "a4-double");
        renderPDFDoc();
      }

      window.selectPageLayout = selectPageLayout;

      async function renderPDFDoc() {
        const revision = ++previewRevision;
        const canvasContainer = document.getElementById("pdfViewer");
        const downloadButton = document.getElementById("downloadButton");
        const errorMessage = document.getElementById("pdfError");
        doc = null;
        docName = null;
        downloadButton.disabled = true;
        canvasContainer.setAttribute("aria-busy", "true");
        errorMessage.classList.add("hidden");
        const layoutSuffix = selectedPageLayout === "a4-double" ? ".a4-two" : "";
        const nextDocName = `${selectedTimeboxRange}.timbox.planner${layoutSuffix}.pdf`;

        let chosenDailyVersion = 1;
        if (selectedDayilyVersion === 'v2') {
          chosenDailyVersion = 2
        } else if (selectedDayilyVersion === 'v3') {
          chosenDailyVersion = 3
        }

        let loadingTask;
        try {
          const nextDoc = getDoc[selectedTimeboxRange]({
            cellSize,
            version: chosenDailyVersion,
            startingHour,
            monthlySplit: selectedMonthlySplit,
            pageLayout: selectedPageLayout,
          });

          const { pdfjsLib } = globalThis;
          pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";

          loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(nextDoc.output("arraybuffer")),
          });

          function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          }

          const scale = isMobileDevice() ? 1.0 : 2.0;

          const pdf = await loadingTask.promise;
          if (revision !== previewRevision) return;

          const page = await pdf.getPage(1);
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          canvas.className = "max-w-full h-auto block";

          const renderContext = {
            canvasContext: context,
            viewport: viewport,
          };
          await page.render(renderContext).promise;
          if (revision !== previewRevision) return;

          // Commit the preview and download together only for the latest selection.
          canvasContainer.replaceChildren(canvas);
          doc = nextDoc;
          docName = nextDocName;
          downloadButton.disabled = false;
        } catch (reason) {
          if (revision !== previewRevision) return;
          console.error(reason);
          canvasContainer.replaceChildren();
          errorMessage.textContent = "Could not prepare the PDF. Choose a layout to try again.";
          errorMessage.classList.remove("hidden");
        } finally {
          if (revision === previewRevision) canvasContainer.setAttribute("aria-busy", "false");
          if (loadingTask) await loadingTask.destroy();
        }
      }

      window.onload = () => {
        // Set the default selected button (day) on page load
        const defaultButton =
          document.getElementById("buttonGroup").children[0];

        // Set the default selected month separation (week) on page load
        const defaultSplitButton =
          document.getElementById("splitButtonGroup").children[1];
        highlightButton(defaultSplitButton, "splitButtonGroup");

        const defaultVersionButton =
          document.getElementById("versionButtonGroup").children[0]
        highlightButton(defaultVersionButton, "versionButtonGroup");
        selectButton(defaultButton);
      };
    </script>
  </body>
</html>
